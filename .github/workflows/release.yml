name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest

      - name: Validate Claude Code skill
        run: python autostar-skill/scripts/quick_validate.py autostar-skill/

      - name: Validate Claude.ai skill
        run: python autostar-skill/scripts/quick_validate.py autostar-claude-ai-skill/

      - name: Run tests
        run: pytest -q

      - name: Package skills
        run: |
          mkdir -p dist
          python autostar-skill/scripts/package_skill.py --target all dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/autostar-skill.skill
            dist/autostar-claude-ai-skill.zip
          generate_release_notes: true
          body: |
            ## Installation

            Claude Code:

            ```bash
            unzip autostar-skill.skill -d ~/.claude/skills/
            ```

            Claude.ai:

            Upload `autostar-claude-ai-skill.zip` as a custom Skill.
